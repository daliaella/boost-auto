name: Boost auto-register

# שני מנגנונים משלימים (הזמנים ב-UTC; ישראל = UTC+3 בקיץ / UTC+2 בחורף):
# 1. בדיקה מהירה כל שעה, 24/7 - רשת ביטחון שתופסת כל שיעור חדש תוך שעה לכל היותר.
# 2. "התקפה ממוקדת" בבקרי ראשון, שני ושלישי (04:00-07:30 UTC = ~07:00-10:30 בישראל) -
#    בדיקה כל דקה סביב שעת הפתיחה הצפויה (08:15), לתפיסה תוך שניות.
on:
  schedule:
    - cron: "7 * * * *"          # כל שעה בדקה 07 - בדיקה מהירה אחת
    - cron: "*/30 4-7 * * 0,1,2"   # ראשון+שני+שלישי בבוקר - סבבי סריקה צמודים
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boost-register
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto-register
        env:
          BOOST_TOKEN: ${{ secrets.BOOST_TOKEN }}
          BOOST_CALENDAR_ICS_URL: ${{ secrets.BOOST_CALENDAR_ICS_URL }}
          TRIGGER: ${{ github.event.schedule }}
        run: |
          if [ "$TRIGGER" = "*/30 4-7 * * 0,1,2" ]; then
            echo "Burst mode: polling every 60s for ~29 minutes"
            end=$((SECONDS + 1740))
            while [ $SECONDS -lt $end ]; do
              python boost_register.py --once || echo "iteration error (continuing)"
              sleep 60
            done
          else
            echo "Single-pass mode"
            python boost_register.py --once
          fi

      # שומר את הריפו "פעיל" כדי שגיטהאב לא ישבית את התזמון אחרי 60 יום
      - name: Keepalive
        if: always()
        run: |
          date -u +%F > last-run.txt
          if ! git diff --quiet last-run.txt 2>/dev/null; then
            git config user.name "boost-bot"
            git config user.email "boost-bot@users.noreply.github.com"
            git add last-run.txt
            git commit -m "keepalive $(date -u +%F)"
            git push
          fi
